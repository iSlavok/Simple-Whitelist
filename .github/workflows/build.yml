name: build
on:
  push:
    branches: [master]
  pull_request:

# Pushing a PR branch fires both push and pull_request; scope + cancel to dedupe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Yarn-mapped versions (1.18.2 .. 1.21.10) build + gametest on JDK 21
  # (a JDK 21 runner cross-compiles the Java 17 anchors via options.release).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: build (all yarn versions + unit + gametests)
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: versions/*/build/libs/*.jar
          if-no-files-found: error

  # Unobfuscated 26+ needs JDK 25; settings only registers those nodes on JDK 25+.
  build-unobfuscated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: build 26.x (+ unit tests)
        run: ./gradlew :26.1.2:build :26.2:build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jars-unobfuscated
          path: versions/26.*/build/libs/*.jar
          if-no-files-found: error

  # Standalone Bukkit plugin build (own settings.gradle.kts, toolchain 21) — kept out
  # of the mod's Stonecutter/Loom grid, built via `-p plugin`.
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: build plugin (shaded jar + unit/MockBukkit tests)
        run: ./gradlew -p plugin build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: plugin/build/libs/*.jar
          if-no-files-found: error
